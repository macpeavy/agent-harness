# LiteLLM gateway — agent-harness spike
# Routes per-persona model calls to OpenRouter and is the system of record for cost
# (OpenCode can't see custom-provider spend — see docs/adrs/0002-gateway-litellm-openrouter.md).
# Secrets come from the environment; never commit keys. See .env.example and config/README.md.
#
# Run:  source .venv/bin/activate && litellm --config config/litellm.yaml
# Listens on http://localhost:4000 by default.

model_list:
  # ── Cheap builder seat (primary): Claude Haiku 4.5. $1 / $5 per M, 200K ctx. Anthropic/US —
  #    Western-governed, known-good native tool-caller. ADR 0025's documented reliability step-up:
  #    gemini-2.5-flash-lite flaked under load (fleet-status-cli, PR #115 — a trivial chunk took
  #    3 dispatches and landed nothing: reviewer-rejected 2x, then idle), exactly the "passes the
  #    trivial gate, flakes at volume" caveat ADR 0025 flagged. Mistral before it no-op'd outright.
  #    Reliability outranks rock-bottom token price — a builder that doesn't land has infinite
  #    effective cost. Ships only with a recorded green `make gate-builder` (ADR 0025).
  - model_name: builder
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY
      # Prompt-cache the cheap builder too (ADR 0026 refinement). Haiku is Anthropic, so it uses the
      # SAME explicit cache_control mechanism as the strong seats — the original "cheap builder =
      # implicit caching, out of scope" exclusion only holds for the non-Anthropic alternates below.
      # The builder is the heaviest re-reader (it re-sends the whole context pack + growing
      # conversation every turn — 457K input tokens uncached in a dogfood build), so caching it is
      # the biggest remaining lever. Same two breakpoints as the strong seats (see below). NOTE:
      # Haiku's min cacheable prefix is 2048 tokens (double Sonnet's 1024) — a build whose context
      # is under that won't cache, but those builds are already cheap. Probed: a 5959-token prefix
      # billed $0.0075 to write then $0.0006 on the cache-read (~11×).
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1

  # ── Validated Western alternates (AGENT-17 probe — both tool-call cleanly; available
  #    fallbacks if the primary regresses). gemini is the OpenRouter half only; the
  #    Google-direct control is deferred pending a Google key. Live pricing 2026-06-07.
  #    NO cache_control here: these are NOT Anthropic — gpt-4.1-nano caches implicitly (OpenAI
  #    automatic prompt caching) and gemini has its own implicit caching; injecting Anthropic-style
  #    cache_control would be dropped/ignored upstream. Their caching needs no config.
  - model_name: builder-nano        # gpt-4.1-nano — $0.10/$0.40, 1M ctx (OpenAI, US)
    litellm_params:
      model: openrouter/openai/gpt-4.1-nano
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: builder-gemini      # gemini-2.5-flash-lite — $0.10/$0.40, 1M ctx (Google, US)
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-lite
      api_key: os.environ/OPENROUTER_API_KEY

  # Prompt caching for the strong (Anthropic) seats (ADR 0026 decision 3). These three routes
  # re-send a large stable prefix every call — review was 3.2× the builder, largely re-reads.
  # LiteLLM's anthropic_cache_control_hook injects `cache_control` at the points below; the chain
  # forwards it (LiteLLM → OpenRouter → Anthropic), which bills a cached prefix at ~0.1× on reads
  # (5-min TTL, refreshed on hit). Two breakpoints:
  #   - role: system → caches the stable persona/standards prefix, SHARED across every call in the
  #     window (e.g. every review in a session — same system prompt, different diffs).
  #   - index: -1    → caches the whole conversation-so-far each turn, so an agentic loop's growing
  #     re-reads (the reviewer runs `git diff` + reads files) hit cache on the next turn.
  # The reviewer is CACHED, not demoted (ADR 0026 alternatives) — same Sonnet, same prompt. The
  # Haiku `builder` above is now cached the same way (it's Anthropic too); only the non-Anthropic
  # alternates (builder-nano / builder-gemini) skip this and rely on their upstream's implicit cache.
  #
  # ── Strong builder seat: the builder persona on the strong route (ADR 0013/0014) — for a
  #    tier-hinted (gnarly) chunk or a tier-promoted escalation. Sonnet; "strong build" is a
  #    routing choice, not a new persona (same builder.md, stronger model). ~$3 / $15 per M.
  - model_name: builder-strong
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.6
      api_key: os.environ/OPENROUTER_API_KEY
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1

  # ── Strong reviewer seat. ~$3 / $15 per M tokens.
  - model_name: reviewer
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.6
      api_key: os.environ/OPENROUTER_API_KEY
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1

  # ── Chief seat (strong): Sonnet — the decomposition / cost engine (ADR 0019). The
  #    expensive reasoner whose decomposition buys cheap building; same upstream as the
  #    reviewer for now, a distinct route name so its spend is tracked separately. The
  #    principal/Opus A/B is a later route (see adding-a-model-route skill). ~$3 / $15 per M.
  - model_name: chief
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.6
      api_key: os.environ/OPENROUTER_API_KEY
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1

litellm_settings:
  # Drop params a given upstream doesn't support rather than 400-ing — keeps the
  # same client call working across mistral / openai / google / anthropic via OpenRouter.
  drop_params: true
  # The cost system of record (ADR 0026, AGENT-41). LiteLLM computes the real cost of every
  # call; this callback appends it to a JSONL ledger (.substrate/litellm-spend.jsonl) the
  # substrate reconciles per route + time window — so a feature's recorded cost is REAL
  # LiteLLM numbers for every leg (build/review/amend) AND the chief, not token-count
  # estimation. The dotted path resolves to config/litellm_spend_logger.py (next to this file).
  # NOTE: this is logging only, not a budget gate. The hard $25 ceiling is still enforced at the
  # OpenRouter key's credit limit (see config/README.md) — LiteLLM's own cross-request budget
  # enforcement / spend dashboard need a Postgres DATABASE_URL (its Prisma store can't be SQLite).
  callbacks: ["litellm_spend_logger.spend_logger_instance"]

general_settings:
  # The bearer key clients (OpenCode, the substrate) present to this gateway.
  master_key: os.environ/LITELLM_MASTER_KEY
